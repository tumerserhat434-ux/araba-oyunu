<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120c06">
<title>Oyunlar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
/* Lilita One'da İ ı Ğ ğ Ş ş yok (başka yazı tipine düşüp bozuk görünüyordu): aynı adla Baloo 2 ExtraBold, Lilita ölçülerine uyarlandı */
@font-face { font-family: 'Lilita One'; font-display: swap; src: url('krallik/assets/fonts/baloo2-800-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+20A0-20AB, U+20AD-20C4; size-adjust: 112%; ascent-override: 91%; descent-override: 23%; line-gap-override: 0%; }
@font-face { font-family: 'Lilita One'; font-display: swap; src: url('krallik/assets/fonts/baloo2-800-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; size-adjust: 112%; ascent-override: 91%; descent-override: 23%; line-gap-override: 0%; }

  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: 'Nunito', sans-serif; color: #fff; background: radial-gradient(ellipse at 50% 0%, #2a2a3a, #0a0a10 70%);
    display: flex; flex-direction: column; align-items: center; padding: max(28px, env(safe-area-inset-top)) 16px 28px; gap: 18px; }
  h1 { margin: 8px 0 4px; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 40px; letter-spacing: 1px; }
  p.sub { margin: 0 0 6px; color: #aab; font-weight: 800; }
  a.card { display: block; width: 100%; max-width: 440px; border-radius: 24px; overflow: hidden; text-decoration: none; color: #fff; position: relative;
    box-shadow: 0 14px 40px rgba(0,0,0,.5); transition: transform .12s; }
  a.card:active { transform: scale(.98); }
  .art { height: 170px; display: grid; place-items: center; font-size: 76px; }
  .info { padding: 14px 18px 18px; }
  .info h2 { margin: 0 0 4px; font-size: 26px; }
  .info span { color: rgba(255,255,255,.75); font-weight: 800; font-size: 14px; }
  .play { position: absolute; right: 16px; bottom: 18px; padding: 10px 18px; border-radius: 14px; font-weight: 900; }
  .ds { background: linear-gradient(180deg, #4a3418, #1e1408); border: 2px solid #b8801c; }
  .ds .art { background: radial-gradient(circle at 50% 40%, #8a6a30, #2a1a08); }
  .ds h2 { font-family: 'Cinzel', serif; color: #f3c24a; }
  .ds .play { background: linear-gradient(180deg, #ffd96a, #e09a1a); color: #3a2000; }
  .ok { background: linear-gradient(180deg, #0e2a22, #04100c); border: 2px solid #2f8a5a; }
  .ok .art { background: radial-gradient(circle at 50% 40%, #1e5a40, #04100c); }
  .ok h2 { font-family: 'Lilita One', sans-serif; font-weight: 400; color: #6fffb0; letter-spacing: 1px; }
  .ok .play { background: linear-gradient(180deg, #ffe27a, #f08a00); color: #1d1100; }
  .new { position: absolute; top: 12px; left: 12px; background: #e0302a; padding: 3px 10px; border-radius: 10px; font-weight: 900; font-size: 12px; }
</style>
</head>
<body>
  <h1>🎮 Oyunlar</h1>
  <p class="sub">Oynamak istediğin oyunu seç</p>
  <a class="card ds" href="krallik/">
    <span class="new">YENİ</span>
    <div class="art">🏰⚔️</div>
    <div class="info"><h2>Demir Sancak</h2><span>Krallık kur, ordu eğit, kahraman çağır, fethet</span></div>
    <span class="play">OYNA ▶</span>
  </a>
  <a class="card ok" href="orman-kacisi/">
    <div class="art">🌿🐻</div>
    <div class="info"><h2>Orman Kaçışı</h2><span>Yağmur ormanında gece koşusu — ayıdan kaç!</span></div>
    <span class="play">OYNA ▶</span>
  </a>
</body>
</html>
