<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1208">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Demir Sancak">
<title>Demir Sancak</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "../lib/three.module.min.js", "three/addons/": "../lib/jsm/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>

<div id="loading" class="loading">
  <div class="crest">⚜</div>
  <h1>DEMİR SANCAK</h1>
  <div class="bar"><span id="loadBar"></span></div>
  <p id="loadTxt">Krallık kuruluyor…</p>
</div>

<!-- Üst çubuk -->
<header id="top" class="hidden">
  <div class="profile" id="profileBtn">
    <div class="avatar">⚜</div>
    <div class="pinfo"><b id="kname">Krallığım</b><small>⚔ <span id="power">0</span></small></div>
  </div>
  <div class="resbar">
    <div class="res" data-r="food"><i>🌾</i><span id="r_food">0</span></div>
    <div class="res" data-r="wood"><i>🪵</i><span id="r_wood">0</span></div>
    <div class="res" data-r="stone"><i>🪨</i><span id="r_stone">0</span></div>
    <div class="res gold" id="goldBtn"><i>🪙</i><span id="r_gold">0</span><b>+</b></div>
  </div>
</header>

<div id="side" class="hidden">
  <div class="chip" id="chipTroops" title="Askerler">🛡️ <span id="troopCount">0</span></div>
  <div class="chip" id="chipBuilders" title="İnşaatçılar">🔨 <span id="builderCount">0/2</span></div>
  <div class="chip warn hidden" id="chipRaid">⚠️ <span id="raidTxt"></span></div>
  <div class="qtrack" id="qtrack"></div>
</div>

<!-- Alt menü -->
<nav id="nav" class="hidden">
  <button data-go="city" class="on"><i>🏰</i><span>Şehir</span></button>
  <button data-go="world"><i>🗺️</i><span>Dünya</span></button>
  <button data-go="quests"><i>📋</i><span>Görev</span><em id="questDot" class="dot hidden"></em></button>
  <button data-go="heroes"><i>🛡️</i><span>Kahraman</span></button>
  <button data-go="summon"><i>🔮</i><span>Çağır</span><em id="freeDot" class="dot hidden"></em></button>
  <button data-go="shop"><i>🪙</i><span>Mağaza</span></button>
  <button data-go="reports"><i>📜</i><span>Rapor</span><em id="repDot" class="dot hidden"></em></button>
</nav>

<!-- Alt panel (bina vb.) -->
<div id="sheetWrap" class="sheet-wrap">
  <div id="sheet" class="sheet"></div>
</div>
<!-- Tam ekran panel -->
<div id="modal" class="modal"><div id="modalBox" class="modal-box"></div></div>
<!-- Sahne üstü katman (savaş, çağırma) -->
<div id="overlay" class="overlay hidden"></div>
<div id="toasts"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
