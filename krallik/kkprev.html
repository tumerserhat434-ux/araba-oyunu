<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;font:12px sans-serif}#l{position:fixed;inset:0;pointer-events:none}#l div{position:absolute;color:#fff;background:#0008;padding:1px 4px;transform:translate(-50%,0)}</style>
<script type="importmap">{ "imports": { "three": "../lib/three.module.min.js", "three/addons/": "../lib/jsm/" } }</script></head><body><div id="l"></div><script type="module">
import * as THREE from 'three'; import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const names = (new URLSearchParams(location.search).get('n') || 'castle,barracks,archeryrange,tower_A,tower_B,tower_catapult,church,tavern,market,blacksmith,windmill,watermill,lumbermill,mine,home_A,home_B,well').split(',');
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.shadowMap.enabled = true; r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x9cc8e8); s.add(new THREE.HemisphereLight(0xffffff, 0x6a7a5a, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.4); sun.position.set(5, 10, 6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15 }); s.add(sun);
const g = new THREE.Mesh(new THREE.PlaneGeometry(80, 80).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x7fb24a })); g.receiveShadow = true; s.add(g);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 200); const cols = 6;
const L = new GLTFLoader(); let n = 0; const items = [];
for (const [i, nm] of names.entries()) {
  const file = nm.includes('/') ? nm : (nm.startsWith('building_') || nm.includes('_') && !['tower_A','tower_B','tower_catapult','home_A','home_B'].includes(nm) ? nm : 'building_' + nm + '_blue');
  L.load('assets/kk/' + (nm.includes('.') ? nm : (['castle','barracks','archeryrange','tower_A','tower_B','tower_catapult','church','tavern','market','blacksmith','windmill','watermill','lumbermill','mine','home_A','home_B','well'].includes(nm) ? 'building_' + nm + '_blue' : nm)) + '.gltf', (gl) => {
    const o = gl.scene; o.traverse((m) => { if (m.isMesh) { m.castShadow = m.receiveShadow = true; } });
    const box = new THREE.Box3().setFromObject(o), sz = box.getSize(new THREE.Vector3());
    o.position.set((i % cols - cols / 2 + 0.5) * 3, 0, Math.floor(i / cols) * 3.2 - 3); s.add(o);
    items.push({ nm: nm + ' ' + sz.x.toFixed(2) + 'x' + sz.y.toFixed(2) + 'x' + sz.z.toFixed(2), p: o.position.clone() });
    if (++n === names.length) done();
  }, undefined, (e) => { console.error(nm, e); if (++n === names.length) done(); });
}
function done() { cam.position.set(0, 13, 17); cam.lookAt(0, 0, 1.5); r.render(s, cam);
  for (const it of items) { const v = it.p.clone().add(new THREE.Vector3(0, -0.2, 1.2)).project(cam); const d = document.createElement('div'); d.textContent = it.nm; d.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; d.style.top = ((1 - v.y) / 2 * innerHeight) + 'px'; document.getElementById('l').appendChild(d); }
  window.ready = true; }
</script></body></html>
