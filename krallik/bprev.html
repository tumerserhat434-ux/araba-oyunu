<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0}</style>
<script type="importmap">{ "imports": { "three": "../lib/three.module.min.js", "three/addons/": "../lib/jsm/" } }</script></head><body><script type="module">
import * as THREE from 'three'; import { createBuilding } from './js/buildings.js';
const q = new URLSearchParams(location.search), key = q.get('k') || 'townhall', lv = (q.get('l') || '1,3,5,7,9,10').split(',').map(Number);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.shadowMap.enabled = true; r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0xa8c8e0); s.add(new THREE.HemisphereLight(0xdfefff, 0x6a5a3a, 1.1));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.6); sun.position.set(20, 40, 25); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40 }); s.add(sun);
const g = new THREE.Mesh(new THREE.PlaneGeometry(200, 200).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x6a8a4a })); g.receiveShadow = true; s.add(g);
const sp = +(q.get('sp') || 14);
lv.forEach((L, i) => { const b = createBuilding(key, L); b.position.set((i % 3 - 1) * sp, 0, Math.floor(i / 3) * -sp); s.add(b); b.userData.update?.(1, 0.016); });
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.5, 300); cam.position.set(18, 40, 52); cam.lookAt(0, 3, -7);
r.render(s, cam); window.ready = true;
</script></body></html>
